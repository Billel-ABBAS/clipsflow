name: Supabase target preflight
on:
  push:
    branches: [ops/supabase-second-account-audit-20261109]
  pull_request:
    paths:
      - scripts/supabase-target-preflight.mjs
      - scripts/supabase-target-preflight.test.mjs
      - .github/workflows/supabase-target-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node --test scripts/supabase-target-preflight.test.mjs
