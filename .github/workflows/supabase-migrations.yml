name: Supabase migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: Supabase project to inspect or update
        required: true
        type: choice
        options:
          - staging
          - production
      mode:
        description: Inspect pending migrations before choosing apply
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - apply
      backup_confirmed:
        description: Required for apply after verifying a restorable backup
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-migrations-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target == 'staging' && 'supabase-staging' || 'supabase-production' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ inputs.target == 'staging' && 'nbktlyedezpkyamgjmhy' || 'hkbzphqdplddlvlkbxus' }}
    steps:
      - name: Verify release branch and credentials
        shell: bash
        run: |
          if [[ "${{ inputs.target }}" == production && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Production migrations require the reviewed main branch.' >&2
            exit 1
          fi
          if [[ "${{ inputs.mode }}" == apply && "${{ inputs.backup_confirmed }}" != true ]]; then
            echo 'Applying migrations requires a verified restorable backup.' >&2
            exit 1
          fi
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo 'Missing scoped Supabase token or database password in the selected GitHub environment.' >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Link the selected project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Inspect migration history and pending SQL
        shell: bash
        run: |
          supabase migration list
          supabase db push --dry-run --skip-vault

      - name: Apply new migrations
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          # Both existing projects were initialized manually. Never replay the
          # initial schema until its applied history has been reconciled with
          # the official Supabase CLI migration repair command.
          if ! history="$(supabase db query --linked --output-format json \
            "SELECT CASE WHEN count(DISTINCT version) = 7 THEN 'BASELINE_HISTORY_COMPLETE' ELSE 'BASELINE_HISTORY_MISSING' END AS status FROM supabase_migrations.schema_migrations WHERE version IN ('0001', '0002', '0003', '20260816133249', '20260922153033', '20260923074735', '20260925000000')" 2>/dev/null)"; then
            echo 'Cannot verify remote migration history; refusing to apply.' >&2
            exit 1
          fi
          if [[ "$history" != *'BASELINE_HISTORY_COMPLETE'* ]]; then
            echo 'Initial migration history is not reconciled; refusing to apply.' >&2
            exit 1
          fi
          pending="$(supabase db push --dry-run --skip-vault 2>&1)"
          if [[ "$pending" == *'0001_init.sql'* ||
                "$pending" == *'0002_clips_schema.sql'* ||
                "$pending" == *'0003_stripe_billing.sql'* ||
                "$pending" == *'20260816133249_p0_security_hardening.sql'* ||
                "$pending" == *'20260922153033_railway_render_worker_leases.sql'* ||
                "$pending" == *'20260923074735_lock_down_trigger_functions.sql'* ||
                "$pending" == *'20260925000000_explicit_data_api_grants.sql'* ]]; then
            echo 'Initial migration history is not reconciled; refusing to replay existing schema.' >&2
            exit 1
          fi
          supabase db push --skip-vault --yes
          supabase migration list
