name: Railway authenticated audio gateway
on:
  push:
    branches: [fix/railway-audio-gateway-20261109]
  pull_request:
    paths: ['deploy/railway/soundbox/**', '.github/workflows/railway-audio-gateway.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: railway-gateway-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Actual HTTP isolation and auth tests (no AI calls)
        run: node --test deploy/railway/soundbox/gateway.test.mjs
      - name: Build pinned private facade
        run: docker build -f deploy/railway/soundbox/Dockerfile -t clipsflow-soundbox-gated:test .
      - name: Default-off launcher fails before starting any model
        run: |
          set +e
          docker run --rm --network none clipsflow-soundbox-gated:test
          code=$?
          set -e
          test "$code" -eq 78
      - name: Real container auth and health, no network or model download
        shell: bash
        run: |
          export CLIPS_SOUNDBOX_PROXY_TOKEN="$(openssl rand -hex 32)"
          docker run -d --name soundbox-gateway-check --network none --memory 1g --cpus 1 \
            -e CLIPS_AUDIO_ROLLOUT_APPROVED=true -e CLIPS_SOUNDBOX_PROXY_TOKEN \
            -e HF_HUB_OFFLINE=1 clipsflow-soundbox-gated:test
          docker exec -i soundbox-gateway-check node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='http://127.0.0.1:8080';
          let ready=false;
          for (let n=0;n<60;n++) {
            try { const r=await fetch(base+'/healthz'); if(r.ok){ready=true;break;} } catch {}
            await new Promise(r=>setTimeout(r,1000));
          }
          assert.ok(ready,'raw Soundbox and gateway did not become ready');
          assert.equal((await fetch(base+'/api/health')).status,401);
          const headers={authorization:`Bearer ${process.env.CLIPS_SOUNDBOX_PROXY_TOKEN}`};
          assert.equal((await fetch(base+'/api/health',{headers})).status,200);
          assert.equal((await fetch(base+'/api/models',{headers})).status,404);
          assert.equal((await fetch(base+'/mcp',{headers})).status,404);
          const health=await (await fetch(base+'/healthz')).json();
          assert.equal(health.inference_verified,false);
          console.log('CONTAINER_AUTH_HEALTH_PASS; inference not tested');
          JS
      - name: Remove ephemeral container and its generated volume
        if: always()
        run: docker rm -fv soundbox-gateway-check 2>/dev/null || true
