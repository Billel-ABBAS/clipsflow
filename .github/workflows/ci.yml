name: CI

on:
  pull_request:
    branches:
      - main
      - "codex/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  railway-web-image:
    name: Railway web image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build web image with synthetic public configuration
        run: |
          docker build -f Dockerfile.web -t clipsflow-web-ci \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://supabase.example.invalid \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=synthetic-public-key \
            --build-arg NEXT_PUBLIC_APP_URL=https://clipsflow.example.invalid .

      - name: Start image and verify HTTP routes
        run: |
          set -eu
          trap 'docker logs clipsflow-web-ci || true; docker rm -f clipsflow-web-ci || true' EXIT
          docker run -d --name clipsflow-web-ci -p 127.0.0.1:31887:31887 \
            -e PORT=31887 clipsflow-web-ci
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:31887/api/health > /tmp/clipsflow-health.json; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          node -e 'const h=require("/tmp/clipsflow-health.json"); if(h.status!=="ok" || h.service!=="clipsflow-web") process.exit(1)'
          curl -fsS http://127.0.0.1:31887/fr > /tmp/clipsflow-home.html
          grep -q '<html' /tmp/clipsflow-home.html
          asset=$(node -e 'const h=require("fs").readFileSync("/tmp/clipsflow-home.html","utf8"); const m=h.match(/\/_next\/static\/[^" ]+\.js/); if(m) process.stdout.write(m[0])')
          test -n "$asset"
          curl -fsS "http://127.0.0.1:31887$asset" > /dev/null

  quality:
    name: Tests, types, lint, build, and Shorts Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        # pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - name: Verify package manager pin
        run: |
          node -e '
            const expected = require("./package.json").packageManager;
            const actual = "pnpm@" + require("node:child_process").execFileSync("pnpm", ["--version"], { encoding: "utf8" }).trim();
            if (expected !== actual) throw new Error("pnpm mismatch: package.json=" + expected + ", installed=" + actual);
          '

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run ESLint
        run: pnpm lint

      - name: Build production application
        run: pnpm build

      - name: Start ephemeral Supabase for the Shorts smoke
        run: pnpm exec supabase start

      - name: Run authenticated Shorts Docker E2E
        run: pnpm smoke:shorts:docker

      - name: Stop ephemeral Supabase
        if: always()
        continue-on-error: true
        run: pnpm exec supabase stop --project-id p0-security-hardening
