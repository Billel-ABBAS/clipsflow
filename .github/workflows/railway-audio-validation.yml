name: Railway audio validation

on:
  push:
    branches: [fix/railway-deployment-20261109]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-audio-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      CLIPS_AI_BUDGET_AUTHORIZED: 'false'
      CLIPS_SOUNDBOX_ENABLED: 'false'
      CLIPS_VOICESTUDIO_ENABLED: 'false'
      CLIPS_CREATIVE_DIRECTOR_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.20.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Full test suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
      - name: TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - name: Build with no production credentials
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
